[package]
name = "codeql-extractor-ucode"
version = "0.1.0"
authors = ["GitHub"]
edition = "2024"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
flate2 = "1.0"
clap = { version = "4.4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }
rayon = "1.8"
regex = "1.11.1"

tree-sitter-ucode = { path = "./tree-sitter" }
# Pinned grammar is ABI 15 (tree-sitter 0.25+). 0.27.1 does not compile against
# codeql-extractor@ce29d8a (Node lifetime change). 0.26.8 is ABI 15 and matches
# github/codeql's tree-sitter-extractor lock at that era.
tree-sitter = "=0.26.8"
# Shared extractor at generator template rev; its crate dep is tree-sitter >= 0.23.
codeql-extractor = { git = "https://github.com/github/codeql", rev = "ce29d8a59af0d25517c622469db17aad826b8d7f" }
